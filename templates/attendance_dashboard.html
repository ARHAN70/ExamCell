{% extends "base.html" %}

{% block content %}
<div class="max-w-7xl mx-auto px-4 py-8">
    
    <div class="flex flex-col md:flex-row justify-between items-end mb-10 gap-4">
        <div>
            <h1 class="text-3xl font-extrabold text-white mb-2">Attendance <span class="text-transparent bg-clip-text bg-gradient-to-r from-blue-400 to-purple-400">Dashboard</span></h1>
            <p class="text-gray-400">Select a Program to view exam records.</p>
        </div>

        <div class="flex gap-3">
            <a href="{{ url_for('invigilator_setup') }}" class="bg-blue-600 hover:bg-blue-500 text-white px-4 py-2.5 rounded-xl font-bold flex items-center gap-2 transition shadow-lg shadow-blue-500/20">
                <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 4v16m8-8H4"></path></svg>
                New Scan
            </a>

            <button onclick="resetDatabase()" class="bg-red-600 hover:bg-red-500 text-white px-4 py-2.5 rounded-xl font-bold flex items-center gap-2 transition shadow-lg shadow-red-900/20 border border-red-500/50">
                <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16"></path></svg>
                Reset Data
            </button>
        </div>
    </div>

    <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-8">
        {% for p in programs %}
        <a href="{{ url_for('attendance_program_view', program_id=p.id) }}" class="group relative block h-48 rounded-3xl overflow-hidden shadow-2xl transition-transform transform hover:-translate-y-2">
            <div class="absolute inset-0 bg-gradient-to-br {{ p.color }} opacity-90 transition group-hover:opacity-100"></div>
            
            <div class="absolute inset-0 bg-[url('https://www.transparenttextures.com/patterns/cubes.png')] opacity-10"></div>
            
            <div class="relative z-10 p-6 flex flex-col justify-between h-full">
                <div>
                    <span class="bg-white/20 backdrop-blur-md text-white text-xs font-bold px-3 py-1 rounded-full uppercase tracking-wider">Program</span>
                    <h2 class="text-2xl font-black text-white mt-2">{{ p.name }}</h2>
                </div>
                
                <div class="flex justify-between items-end">
                    <div>
                        <p class="text-white/80 text-sm font-medium">Total Records</p>
                        <p class="text-4xl font-bold text-white">{{ p.count }}</p>
                    </div>
                    <div class="w-10 h-10 bg-white/20 rounded-full flex items-center justify-center group-hover:scale-110 transition">
                        <svg class="w-5 h-5 text-white" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="3" d="M9 5l7 7-7 7"></path></svg>
                    </div>
                </div>
            </div>
        </a>
        {% endfor %}
    </div>
</div>

<script>
    async function resetDatabase() {
        if(!confirm("⚠️ ARE YOU SURE?\n\nThis will DELETE ALL attendance records and scan history.\nThis action cannot be undone.")) {
            return;
        }
    
        try {
            const res = await fetch('/reset_attendance', { method: 'POST' });
            const data = await res.json();
            
            if(data.status === 'success') {
                alert(data.message);
                location.reload(); // Refresh to update counts to 0
            } else {
                alert("Error: " + data.message);
            }
        } catch(e) {
            alert("Server Error: Could not reset database.");
        }
    }
</script>
{% endblock %}
