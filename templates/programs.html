{% extends "base.html" %}
{% block content %}
<div class="max-w-3xl mx-auto glass-panel p-4 sm:p-8 rounded-2xl">
    <h2 class="text-2xl font-bold mb-6">Program Manager</h2>
    
    <!-- Changed to flex-col for mobile, sm:flex-row for desktop -->
    <form method="POST" action="{{ url_for('programs') }}" class="flex flex-col sm:flex-row gap-4 mb-8">
        <input type="text" name="name" placeholder="Enter Program Name (e.g. MBA MARKETING 2024-26)" class="flex-1 bg-gray-800 border border-gray-600 rounded px-4 py-2 text-white" required>
        <button type="submit" class="bg-primary px-6 py-2 rounded font-bold hover:bg-indigo-500 w-full sm:w-auto text-white">Create Program</button>
    </form>

    <h3 class="font-bold text-gray-400 mb-4">Active Programs</h3>
    <ul class="space-y-3">
        {% for program in programs %}
        <!-- Added flex-col on mobile to prevent squishing text, row on sm screens -->
        <li class="bg-gray-800 p-3 rounded border border-gray-700 flex flex-col sm:flex-row justify-between items-start sm:items-center gap-3">
            
            <!-- Standard View -->
            <div id="view-{{ program.id }}" class="flex-1 w-full flex justify-between items-center">
                <span class="text-white font-medium truncate pr-2">{{ program.name }}</span>
                <div class="flex items-center gap-2">
                    <span class="text-green-500 text-xs font-mono bg-green-900/30 px-2 py-1 rounded border border-green-800 hidden sm:inline-block">ACTIVE</span>
                    
                    <!-- Action Buttons -->
                    <button onclick="toggleEdit({{ program.id }})" class="text-blue-400 hover:text-blue-300 p-1" title="Edit">
                        <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M11 5H6a2 2 0 00-2 2v11a2 2 0 002 2h11a2 2 0 002-2v-5m-1.414-9.414a2 2 0 112.828 2.828L11.828 15H9v-2.828l8.586-8.586z" /></svg>
                    </button>
                    <form method="POST" action="{{ url_for('delete_program', id=program.id) }}" onsubmit="return confirm('Are you sure you want to delete this program?');" class="inline">
                        <button type="submit" class="text-red-400 hover:text-red-300 p-1" title="Delete">
                            <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16" /></svg>
                        </button>
                    </form>
                </div>
            </div>

            <!-- Edit View (Hidden by default) -->
            <form id="edit-{{ program.id }}" method="POST" action="{{ url_for('edit_program', id=program.id) }}" class="hidden w-full flex flex-col sm:flex-row gap-2">
                <input type="text" name="name" value="{{ program.name }}" class="flex-1 bg-gray-700 border border-gray-500 rounded px-3 py-1 text-white w-full" required>
                <div class="flex gap-2 justify-end">
                    <button type="submit" class="bg-green-600 hover:bg-green-500 text-white px-3 py-1 rounded text-sm font-bold">Save</button>
                    <button type="button" onclick="toggleEdit({{ program.id }})" class="bg-gray-600 hover:bg-gray-500 text-white px-3 py-1 rounded text-sm">Cancel</button>
                </div>
            </form>

        </li>
        {% else %}
        <li class="text-gray-500 text-center py-4">No programs yet.</li>
        {% endfor %}
    </ul>
</div>

<script>
function toggleEdit(id) {
    const viewDiv = document.getElementById('view-' + id);
    const editForm = document.getElementById('edit-' + id);
    
    if (viewDiv.classList.contains('hidden')) {
        viewDiv.classList.remove('hidden');
        viewDiv.classList.add('flex');
        editForm.classList.add('hidden');
        editForm.classList.remove('flex');
    } else {
        viewDiv.classList.add('hidden');
        viewDiv.classList.remove('flex');
        editForm.classList.remove('hidden');
        editForm.classList.add('flex');
    }
}
</script>
{% endblock %}
